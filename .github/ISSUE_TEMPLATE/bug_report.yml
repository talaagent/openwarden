name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Never post passwords, API keys, tokens, protected keys or sync responses; use a throwaway account and synthetic items. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small code example, with synthetic input when possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error (its Display and the variant) and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: "warden-client version, Rust version, OS, and the server: Bitwarden cloud (US or EU), self-hosted Bitwarden or Vaultwarden, and its version."
    validations:
      required: true
