name: Feature request
description: Suggest an API, server feature, or documentation improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and where does the current API fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example call, and any alternatives you considered.
    validations:
      required: true
