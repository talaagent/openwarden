# CI: fmt, clippy, tests (with and without `std`), a no_std target build,
# MSRV, docs, cargo-deny, package verification, and the Nix flake with a
# known-answer fixture drift check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain the crate is developed against. Bump it with
  # release-plz.yml's.
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # cargo faster check   # enable once cargo-faster >= 0.1.0 is on crates.io (needs talaagent/cargo-faster#88)

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Known-answer tests, the mock-server flows and the URI matching
      # tables; no network beyond the local mock server.
      - run: cargo nextest run --profile ci --workspace --all-targets --all-features --locked
      # The README's example, compiled (lib.rs includes the README).
      - run: cargo test --workspace --all-features --doc --locked

  test-no-std:
    name: test (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The crate without `std`, on the host: the no_std code paths and the
      # cfg gates (the HTTP flow tests need `std` and are skipped).
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --no-default-features --locked

  no-std:
    name: no_std build (wasm32v1-none)
    runs-on: ubuntu-latest
    env:
      # getrandom has no backend for wasm32v1-none; a no_std user brings
      # one (see the README).
      RUSTFLAGS: --cfg getrandom_backend="custom"
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # A target without std: anything that pulls std in fails to build.
      - run: cargo build --workspace --no-default-features --target wasm32v1-none --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # Re-resolve Cargo.lock with a current cargo, whose rust-version-aware
      # resolver (resolver 3) picks dependency versions that still build on
      # the MSRV.
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo generate-lockfile
      # dtolnay/rust-toolchain master @ 2026-10-16; installs the MSRV (rust-version)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features --locked
      - run: cargo +${{ steps.msrv.outputs.version }} test --workspace --all-features --locked

  doc:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Licenses (permissive only), advisories, bans and sources: see
      # deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  package:
    name: package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.100.0)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # Packages the crate and builds it from the packaged sources.
      - run: cargo publish --workspace --dry-run --locked

  nix:
    name: Nix flake and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Builds and tests the crate in the Nix sandbox.
      - run: nix flake check -L
      - run: nix develop --command cargo nextest --version
      # The known-answer fixtures, regenerated with OpenSSL (deterministic),
      # must match the committed ones.
      - run: nix develop --command bash scripts/gen-fixtures.sh | diff -u crates/openwarden/tests/fixtures/kat.json -
