[package]
name = "warden-client"
description = "An async Rust client library for the Bitwarden and Vaultwarden personal-vault API: API-key login, unlock, sync, field-by-field decryption and URI matching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/warden-client"
authors.workspace = true
rust-version.workspace = true
# The repository README (a symlink), as on crates.io.
readme = "README.md"
keywords = ["bitwarden", "vaultwarden", "password-manager", "api-client", "async"]
categories = ["api-bindings", "authentication", "cryptography", "web-programming::http-client"]

[dependencies]
# Crypto: RustCrypto, at the versions the wider tree already builds.
aes = "0.9"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
# Matching: the public suffix list (compiled in) and the URL parser.
psl = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
url = "2"
# HTTP: reqwest 0.13 on rustls (aws-lc-rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
