[package]
name = "wardwire"
description = "An async client for the Bitwarden and Vaultwarden API: login, sync, decryption and URI matching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
keywords = ["bitwarden", "vaultwarden", "password-manager", "client"]
categories = ["api-bindings", "cryptography"]

[dependencies]
# Crypto: RustCrypto, at the versions the wider tree already builds.
aes = "0.9"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
# Matching: the public suffix list (compiled in) and the URL parser.
psl = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
url = "2"
# HTTP: reqwest 0.13 on rustls (aws-lc-rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true
