[package]
name = "openwarden"
description = "An async Rust client library for the Bitwarden and Vaultwarden personal-vault API: API-key login, unlock, sync, field-by-field decryption and URI matching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openwarden"
authors.workspace = true
rust-version.workspace = true
# The repository README (a symlink), as on crates.io.
readme = "README.md"
keywords = ["bitwarden", "vaultwarden", "password-manager", "api-client", "async"]
categories = ["api-bindings", "authentication", "cryptography", "web-programming::http-client"]

[features]
default = ["std"]
# The HTTP client (`Client`, `Session` and the login writes), the system
# clock, and std support in the dependencies. Without it the crate is
# `no_std` + `alloc`: KDFs and unlock, `EncString`s, sync parsing, field
# decryption, URI matching and TOTP.
std = [
    "dep:reqwest",
    "base64/std",
    "regex-automata/std",
    "serde/std",
    "serde_json/std",
    "subtle/std",
    "thiserror/std",
    "tracing/std",
    "url/std",
]

[dependencies]
# Crypto: RustCrypto, at the versions the wider tree already builds.
aes = "0.9"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = { version = "2", default-features = false, features = ["i128"] }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
# Matching: the public suffix list (compiled in), the URL parser, and the
# regex engine behind `regex` (which needs std), with the same features.
psl = "2"
regex-automata = { version = "0.4", default-features = false, features = ["alloc", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf", "unicode"] }
url = { version = "2", default-features = false }
# HTTP: reqwest 0.13 on rustls (aws-lc-rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"

# The HTTP flows against a mock server: they need the client.
[[test]]
name = "flow"
required-features = ["std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
