# release-plz: https://release-plz.dev/docs/config
#
# Runs from .github/workflows/release-plz.yml while the repository is public
# and owned by talaagent. One crate, one CHANGELOG.md, `v<version>` tags and
# GitHub releases.
[workspace]
publish = true
# cargo-semver-checks against the last published version.
semver_check = true
pr_draft = false
pr_labels = ["release"]
# Publish only when the pushed commit is a merged release-plz PR, not on any
# version bump.
release_always = false

[[package]]
name = "warden-client"
changelog_update = true
changelog_path = "CHANGELOG.md"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
